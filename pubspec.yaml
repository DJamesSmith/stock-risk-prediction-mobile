name: stock_risk_engine_mobile
description: "Flutter test client for the Stock Portfolio Risk and Forecasting Platform (REST + live WebSocket)."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  web_socket_channel: ^3.0.2
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  go_router: ^16.0.0
  fl_chart: ^1.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/